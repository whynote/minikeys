name: Windows build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - name: Test key mapping and settings
        shell: pwsh
        run: ./tests/run.ps1 -ModelOnly
      - name: Package
        shell: pwsh
        run: ./package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: MiniKeys-Windows
          path: dist/
